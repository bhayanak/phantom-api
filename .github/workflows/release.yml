name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phantomapi-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stamp the version from the tag
        # The tag is the source of truth. A final tag must match what the source
        # declares, or we would publish an artefact whose version disagrees with
        # the thing it was cut from. A prerelease tag stamps itself in, so a
        # rehearsal can never consume the real version number on PyPI.
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import pathlib, re, sys

          tag = sys.argv[1]
          targets = {
              "pyproject.toml": "version",
              "src/phantom_api/__init__.py": "__version__",
          }
          declared = re.search(
              r'(?m)^version = "(.*)"$', pathlib.Path("pyproject.toml").read_text()
          ).group(1)

          if "-" not in tag and tag != declared:
              sys.exit(f"::error::tag v{tag} does not match declared version {declared}")

          for path, key in targets.items():
              p = pathlib.Path(path)
              body, n = re.subn(
                  rf'(?m)^{key} = ".*"$', f'{key} = "{tag}"', p.read_text(), count=1
              )
              if n != 1:
                  sys.exit(f"::error::could not stamp {key} in {path}")
              p.write_text(body)
          print(f"building {tag}")
          PY
      - run: pip install build
      - run: python -m build --sdist --wheel --outdir dist/
      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install "$(ls dist/*.whl)[mock]"
          /tmp/verify/bin/phantom-api --version
          /tmp/verify/bin/phantom-api mock list-packs
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/phantom-api
          # latest must never point at a release candidate.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build for scanning (amd64, not pushed)
        # Scan before publishing. A vulnerable image that reached Docker Hub is
        # a vulnerable image somebody has already pulled.
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: phantom-api:release-candidate
      - name: Scan the release candidate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: phantom-api:release-candidate
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true


