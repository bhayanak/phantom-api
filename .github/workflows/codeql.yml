name: CodeQL

# Static analysis for the Security tab. Separate from CI so a scheduled run
# keeps finding things in code nobody has touched for a while -- new queries
# ship regularly, and the code they flag is usually old.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, early. Weekly is enough for a codebase this size.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds lower-confidence rules. Worth the noise for a
          # tool that parses untrusted XML and evaluates expressions from config.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
